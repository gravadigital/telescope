# Stack de la API de Telescopio: API + PostgreSQL + MinIO.
#
#   cp .env.example .env
#   docker compose up -d --build
#
# API:            http://localhost:${API_PORT:-8080}/health
# MinIO console:  http://localhost:${MINIO_CONSOLE_PORT:-9001}
# pgAdmin:        docker compose --profile tools up -d
#
# La web se levanta aparte, desde el repo Telescopio-web.

name: telescopio-api

services:
  postgres:
    image: postgres:15-alpine
    container_name: telescopio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telescopio_db}
      POSTGRES_USER: ${POSTGRES_USER:-telescopio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telescopio_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - telescopio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telescopio} -d ${POSTGRES_DB:-telescopio_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # MinIO dejó de publicar imágenes (Docker Hub y quay.io); pgsty mantiene builds del mismo código.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: telescopio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - telescopio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Crea el bucket la primera vez y termina.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: telescopio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-telescopio} &&
      echo 'Bucket ${MINIO_BUCKET:-telescopio} listo';
      "
    networks:
      - telescopio
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: telescopio/api:local
    container_name: telescopio-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-telescopio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-telescopio_password}
      DB_NAME: ${POSTGRES_DB:-telescopio_db}
      DB_SSLMODE: ${DB_SSLMODE:-disable}

      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en el archivo .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}

      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      CORS_ALLOW_METHODS: ${CORS_ALLOW_METHODS:-GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS}
      CORS_ALLOW_HEADERS: ${CORS_ALLOW_HEADERS:-Origin,Content-Length,Content-Type,Authorization}

      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      STORAGE_LOCAL_PATH: /app/uploads
      UPLOADS_DIR: /app/uploads
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-telescopio}
      MINIO_USE_SSL: "false"
      MINIO_REGION: ${MINIO_REGION:-us-east-1}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Telescopio}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - telescopio

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: telescopio-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@telescopio.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telescopio
    profiles:
      - tools

volumes:
  postgres_data:
  minio_data:
  uploads_data:
  pgadmin_data:

networks:
  telescopio:
    driver: bridge
