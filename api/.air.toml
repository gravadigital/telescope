# Configuración de hot reload para desarrollo (usada por Dockerfile.dev)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "uploads", "docs", "bin", "migrations"]
  exclude_regex = ["_test\\.go"]
  delay = 1000
  stop_on_error = true

[log]
  time = true
