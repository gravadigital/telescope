openapi: 3.0.3

info:
  title: Telescopio API
  version: 1.1.0
  description: |
    API del sistema de asignación de tiempo de telescopio.

    Gestiona eventos de convocatoria, participantes, propuestas y el motor de
    **votación distribuida por pares** (Modified Borda Count, Merrifield & Saari 2009).

    ## Autenticación

    JWT Bearer HS256 con vigencia de 24 horas, obtenido de `/users/authenticate`,
    `/users` o `/auth/google/verify`. No hay refresh token.

    ## Formas de error

    El servicio **no tiene una forma de error uniforme**. Conviven cuatro:

    - `ApiError` — `{error, code, details?}` — la de los handlers. `error` es el mensaje.
    - `MiddlewareError` — `{error, message}` — la de los middlewares de auth y permisos.
      Acá `error` es el **código**: es la inversa de `ApiError`. Aparece en todo endpoint
      protegido antes de entrar al handler.
    - `LegacyError` — `{error}` sin `code` — en los endpoints de votación distribuida.
    - La de `/health`, con `status` y `service`.

    Ver `docs/architectures/api/conventions/error-handling.md`.

    ## Envelopes de éxito

    La mayoría usa `{data: ...}`, pero hay heredados: `{event}` en crear evento, `{user}`
    en los de usuario, `{assignment, event_name, participant_id}` en la asignación, y
    payload plano en el envío de rankings y en el registro con Google.

    ## Autenticación opcional (REQ-003, S-008)

    Los endpoints públicos de eventos usan `OptionalJWTAuthMiddleware`: si llega un
    `Authorization` válido identifican al usuario; si falta o es inválido siguen como
    anónimo (nunca responden 401 por esto). Un evento en `creation` responde
    `404 EVENT_NOT_FOUND` a quien no sea su autor ni `admin`.

servers:
  - url: http://localhost:8080
    description: Desarrollo local

tags:
  - name: Health
  - name: Usuarios y autenticación
  - name: Google OAuth
  - name: Eventos
  - name: Participación
  - name: Propuestas
  - name: Votación distribuida
  - name: Borradores de voto
  - name: Notificaciones

security:
  - bearerAuth: []

paths:

  /health:
    get:
      tags: [Health]
      summary: Estado del servicio y de la base
      security: []
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: api }
                  version:
                    type: string
                    example: '0.2.0'
                    description: 'La versión con la que se compiló el binario: `0.2.0` en un release, `dev-<sha>` en una imagen dev, `dev` en un build a mano'
                  database: { type: string, example: connected }
        '503':
          description: Base inaccesible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  service: { type: string }
                  version: { type: string }
                  error:
                    type: string
                    enum: [database connection failed, database ping failed]

  /api/v1/users:
    post:
      tags: [Usuarios y autenticación]
      summary: Registrar usuario
      description: Crea el usuario y devuelve un JWT listo para usar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                lastname: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, format: password }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: User created successfully }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/UserSummary' }
        '400':
          description: '`INVALID_PAYLOAD`, `INVALID_PASSWORD`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`EMAIL_ALREADY_EXISTS`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`CREATION_ERROR`, `TOKEN_GENERATION_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/users/authenticate:
    post:
      tags: [Usuarios y autenticación]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: User authenticated successfully }
                  token: { type: string }
                  user: { $ref: '#/components/schemas/UserSummary' }
        '400':
          description: '`INVALID_PAYLOAD`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401':
          description: |
            `INVALID_CREDENTIALS` — usuario inexistente o password incorrecta.
            `OAUTH_ACCOUNT_NO_PASSWORD` — cuenta de Google sin password local.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`TOKEN_GENERATION_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/users/forgot-password:
    post:
      tags: [Usuarios y autenticación]
      summary: Solicitar recuperación de password
      description: |
        Responde `200` aunque el email no exista, para no permitir enumeración de usuarios.
        También responde `200` si falla el envío del mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Solicitud procesada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If that email is registered, a reset link has been sent.
        '400':
          description: '`INVALID_PAYLOAD` (sin `details`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`TOKEN_GENERATION_ERROR`, `DB_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/users/reset-password:
    post:
      tags: [Usuarios y autenticación]
      summary: Definir nueva password con token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: Token de 64 caracteres hex, válido 1 hora }
                password: { type: string, minLength: 8, format: password }
      responses:
        '200':
          description: Password actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Password updated successfully. }
        '400':
          description: '`INVALID_PAYLOAD`, `INVALID_RESET_TOKEN`, `EXPIRED_RESET_TOKEN`, `INVALID_PASSWORD`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`DB_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/auth/google/verify:
    post:
      tags: [Google OAuth]
      summary: Verificar token de Google
      description: |
        Recibe un **access token** de Google (flujo implicit). La respuesta es polimórfica
        según si el usuario ya existe (devuelve JWT) o no (devuelve el perfil para completar
        registro).

        El token se valida contra `tokeninfo` antes de leer el perfil: se rechaza si no fue
        emitido para `GOOGLE_CLIENT_ID` (`aud`), si el email no está verificado, o si
        `userinfo` devuelve otro `sub`. Sin `GOOGLE_CLIENT_ID` configurado, el login con
        Google responde `500`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Usuario existente
                    properties:
                      status: { type: string, enum: [existing_user] }
                      token: { type: string, description: JWT de la aplicación }
                      user:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          email: { type: string, format: email }
                          username: { type: string, description: Mapea a User.Name }
                  - type: object
                    title: Usuario nuevo
                    properties:
                      status: { type: string, enum: [new_user] }
                      google_token: { type: string, description: El mismo token recibido }
                      profile:
                        type: object
                        properties:
                          email: { type: string, format: email }
                          suggested_name: { type: string }
        '400':
          description: '`INVALID_PAYLOAD`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401':
          description: '`INVALID_GOOGLE_TOKEN` — token inválido o vencido, emitido para otro client ID, o email sin verificar'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`GOOGLE_API_ERROR` (Google inaccesible o `GOOGLE_CLIENT_ID` sin configurar), `INTERNAL_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/auth/google/register:
    post:
      tags: [Google OAuth]
      summary: Registrar usuario con Google
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username]
              properties:
                token: { type: string }
                username:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Sin tabulaciones ni saltos de línea
      responses:
        '201':
          description: Usuario creado. Sin `message` ni `code`, a diferencia de otros 201.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      email: { type: string, format: email }
                      username: { type: string }
        '400':
          description: '`INVALID_PAYLOAD`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401':
          description: '`INVALID_GOOGLE_TOKEN`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`USERNAME_ALREADY_EXISTS`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`GOOGLE_API_ERROR`, `INTERNAL_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/users/{user_id}:
    get:
      tags: [Usuarios y autenticación]
      summary: Obtener usuario
      description: |
        **No verifica ownership**: cualquier usuario autenticado puede leer cualquier otro.
        Tampoco valida el formato del UUID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: '`USER_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/users/{user_id}/events:
    get:
      tags: [Usuarios y autenticación]
      summary: Eventos del usuario (participa y, con scope=all, organiza)
      description: |
        Solo el propio usuario. Los campos `title`, `date` y `creator_id` están duplicados
        de `name`, `start_date` y `author_id` por compatibilidad con el frontend.

        Con `scope=all` (S-008) incluye también los eventos que el usuario creó, incluso en
        `creation`, y cada ítem trae `role`; los ítems con `role = participant` traen
        `my_status`. La posición sale de `voting_results.adjusted_ranking`. Las consultas de
        estado personal se hacen por lote, sin N+1.

        **Las fechas acá salen en RFC3339 completo**, no en `YYYY-MM-DD` como en el resto
        de los endpoints de eventos.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: scope
          in: query
          schema: { type: string, enum: [participating, all], default: participating }
          description: '`participating` = comportamiento histórico; `all` agrega los eventos organizados'
      responses:
        '200':
          description: Lista de eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        title: { type: string, description: Duplicado de name }
                        description: { type: string }
                        stage: { $ref: '#/components/schemas/Stage' }
                        start_date: { type: string, format: date-time }
                        date: { type: string, format: date-time, description: Duplicado de start_date }
                        end_date: { type: string, format: date-time }
                        organizer: { type: string }
                        author_id: { type: string, format: uuid }
                        creator_id: { type: string, format: uuid, description: Duplicado de author_id }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
                        role: { type: string, enum: [creator, participant], description: 'S-008' }
                        max_participants: { type: integer, nullable: true }
                        participants_count: { type: integer }
                        participation_estimated_end_date: { type: string, format: date, nullable: true }
                        voting_estimated_end_date: { type: string, format: date, nullable: true }
                        is_paused: { type: boolean }
                        is_cancelled: { type: boolean }
                        my_status:
                          type: object
                          nullable: true
                          description: Solo si role = participant
                          properties:
                            has_attachment: { type: boolean }
                            has_assignment: { type: boolean }
                            ranking_submitted: { type: boolean }
                            result_position: { type: integer, nullable: true, description: 'Posición en adjusted_ranking; null fuera de results' }
                            result_total: { type: integer, nullable: true }
        '401':
          description: '`NO_AUTH_TOKEN`, `UNAUTHORIZED_ACCESS` (accediendo a eventos ajenos; semánticamente debería ser 403)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403':
          description: '`FORBIDDEN` — `scope=all` sobre otro usuario (S-008)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`RETRIEVAL_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events:
    get:
      tags: [Eventos]
      summary: Listar eventos
      description: |
        Paginación **en memoria**: trae todos los eventos y pagina después, con una consulta
        de participantes por evento (N+1).

        **Nunca devuelve eventos en `creation`** (S-008); `stage=creation` → `data: []`.
        `stage_counts` se calcula sobre el conjunto filtrado por `q`, antes de filtrar por
        `stage` y de paginar.
      security: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
          description: Se ignora si es ≤0 o no parseable
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
          description: Solo se acepta entre 1 y 100
        - name: stage
          in: query
          schema: { $ref: '#/components/schemas/Stage' }
        - name: q
          in: query
          schema: { type: string }
          description: 'Búsqueda case-insensitive por `name` u `organizer` (S-008)'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventListItem' }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      total_pages: { type: integer }
                  filters:
                    type: object
                    properties:
                      stage: { type: string }
                  stage_counts:
                    type: object
                    description: 'S-008'
                    properties:
                      participation: { type: integer }
                      voting: { type: integer }
                      results: { type: integer }
        '400':
          description: '`INVALID_STAGE_FILTER` — incluye `valid_stages`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`RETRIEVAL_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

    post:
      tags: [Eventos]
      summary: Crear evento
      description: |
        El autor sale siempre del JWT. El campo `author_id` del body existe en el struct
        pero **nunca se lee**.

        El envelope de respuesta es `event`, no `data`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, start_date, end_date]
              properties:
                name: { type: string, minLength: 3, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 2000 }
                start_date: { type: string, format: date, description: 'Formato YYYY-MM-DD. No puede ser pasada' }
                end_date: { type: string, format: date, description: 'Formato YYYY-MM-DD. Duración entre 1 y 365 días' }
                organizer: { type: string }
                max_participants:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                  nullable: true
      responses:
        '201':
          description: Evento creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      description: { type: string }
                      start_date: { type: string, format: date }
                      end_date: { type: string, format: date }
                      organizer: { type: string }
                      shareable_link: { type: string, example: '/events/3fa85f64-5717-4562-b3fc-2c963f66afa6' }
                      max_participants: { type: integer, nullable: true }
                      stage: { $ref: '#/components/schemas/Stage' }
                      author_id: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
                  message: { type: string, example: Event created successfully }
                  code: { type: string, example: EVENT_CREATED }
        '400':
          description: |
            `INVALID_PAYLOAD`, `INVALID_START_DATE`, `INVALID_END_DATE`, `PAST_START_DATE`,
            `INVALID_DATE_RANGE`, `DURATION_TOO_SHORT`, `DURATION_TOO_LONG`,
            `INVALID_MAX_PARTICIPANTS`, `MAX_PARTICIPANTS_LIMIT_EXCEEDED`, `VALIDATION_FAILED`
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401':
          description: '`UNAUTHORIZED`, `USER_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`DUPLICATE_EVENT_NAME`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`INVALID_TOKEN`, `DB_CREATE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}:
    get:
      tags: [Eventos]
      summary: Detalle del evento
      description: |
        Autenticación opcional. Un evento en `creation` responde `404 EVENT_NOT_FOUND` a quien
        no sea su autor ni `admin` (S-008).
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: include_stats
          in: query
          schema: { type: string, enum: ['true'] }
          description: Si es exactamente `true`, agrega `statistics` en la raíz (no dentro de `data`)
      responses:
        '200':
          description: Evento
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EventDetail' }
                  statistics:
                    type: object
                    description: Solo con include_stats=true
                    properties:
                      participants_count: { type: integer }
                      duration_days: { type: integer }
        '400':
          description: '`MISSING_EVENT_ID`, `INVALID_EVENT_ID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: '`EVENT_NOT_FOUND` (también para un evento en `creation` ajeno)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

    patch:
      tags: [Eventos]
      summary: Editar datos del evento
      description: |
        S-008. Solo el autor (`RequireEventOwner`) y solo en `creation` o `participation`.
        Al menos un campo. Las fechas no se editan acá.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 3, maxLength: 200 }
                description: { type: string, minLength: 10, maxLength: 2000 }
                organizer: { type: string, maxLength: 200 }
                max_participants: { type: integer, minimum: 1, maximum: 100, description: 'No puede ser menor a los inscriptos' }
      responses:
        '200':
          description: Evento actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EventDetail' }
                  message: { type: string }
                  code: { type: string, example: EVENT_UPDATED }
        '400':
          description: '`INVALID_PAYLOAD`, `MAX_PARTICIPANTS_BELOW_REGISTERED` (+ `current_count`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`INVALID_UPDATE_STAGE` (+ `current_stage`), `DUPLICATE_EVENT_NAME`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/share:
    get:
      tags: [Eventos]
      summary: Metadata para compartir en redes
      description: 'Autenticación opcional; un evento en `creation` ajeno responde 404 (S-008).'
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Metadata social
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      title: { type: string }
                      description: { type: string, description: Truncada a 197 caracteres + '...' si supera 200 }
                      share_url: { type: string }
                      shareable_link: { type: string }
                      image_url: { type: string }
                      stage: { $ref: '#/components/schemas/Stage' }
                      start_date: { type: string, format: date }
                      end_date: { type: string, format: date }
                      organizer: { type: string }
                  statistics:
                    type: object
                    properties:
                      participants_count: { type: integer }
                      attachments_count: { type: integer }
                  social_meta:
                    type: object
                    properties:
                      og_title: { type: string }
                      og_description: { type: string }
                      og_type: { type: string, example: website }
                      og_url: { type: string }
                      og_image: { type: string }
                      twitter_card: { type: string, example: summary_large_image }
                      twitter_title: { type: string }
                      twitter_description: { type: string }
                      twitter_image: { type: string }
        '400':
          description: '`INVALID_EVENT_ID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/register:
    post:
      tags: [Participación]
      summary: Registrarse en un evento
      description: |
        Endpoint público, pensado para el link compartible. **Crea el usuario si el email no
        existe** (sin password). Solo durante la etapa `participation`. El creador del evento
        no puede registrarse como participante. Cupo por defecto 20 si el evento no define uno.

        Efectos (S-009): notificación `registration_confirmed` al inscripto y
        `participant_registered` (agregada por evento mientras no se lea) al autor. Un evento
        en `creation` ajeno responde 404 (S-008).
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_name, participant_email]
              properties:
                participant_name: { type: string, minLength: 2, maxLength: 100 }
                participant_email: { type: string, format: email }
      responses:
        '201':
          description: Participante registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      participant_id: { type: string, format: uuid }
                      participant_name: { type: string }
                      participant_email: { type: string, format: email }
                      event_id: { type: string, format: uuid }
                      event_name: { type: string }
                      registered_at: { type: string, format: date-time }
                  message: { type: string }
                  code: { type: string, example: PARTICIPANT_REGISTERED }
        '400':
          description: |
            `MISSING_EVENT_ID`, `INVALID_EVENT_ID`, `INVALID_PAYLOAD`,
            `INVALID_REGISTRATION_STAGE` (+ `current_stage`), `CREATOR_CANNOT_REGISTER`,
            `MAX_PARTICIPANTS_REACHED` (+ `current_count`, `max_participants`)
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403':
          description: '`EVENT_PAUSED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`ALREADY_REGISTERED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`USER_CREATE_ERROR`, `PARTICIPANT_CHECK_ERROR`, `REGISTRATION_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/stage:
    patch:
      tags: [Eventos]
      summary: Avanzar la etapa del evento
      description: |
        Solo el autor del evento o un admin. Las transiciones válidas son
        `creation → participation → voting → results`, sin retroceso ni saltos.

        `estimated_end_date` es obligatoria cuando la etapa destino es `participation` o
        `voting`.

        **Pasar a `voting` (S-006)** exige al menos **3 participantes con propuesta**
        (`INSUFFICIENT_ATTACHMENTS`, `required_minimum: 3`) y `voting_config`. Se valida todo
        antes de escribir y, en una transacción, se actualiza la etapa, se guarda la
        configuración y se generan las asignaciones **solo para participantes con propuesta**.
        Si la escritura falla → rollback y `500 VOTING_SETUP_ERROR`; el evento sigue en
        `participation`.

        Pasar a `results` calcula el ranking MBC y lo guarda en `voting_results`, también con
        rankings faltantes (CHECK relajado, migración 023). Si el cálculo falla, el cambio de
        etapa igual se aplica y el error solo queda en el log.

        Dispara emails a los participantes en segundo plano y notificaciones in-app
        `stage_changed` (S-009).
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { $ref: '#/components/schemas/Stage' }
                estimated_end_date:
                  type: string
                  format: date
                  description: 'YYYY-MM-DD. Obligatoria si stage es participation o voting'
                voting_config:
                  type: object
                  description: 'Obligatorio si stage = voting (S-006)'
                  required: [attachments_per_evaluator]
                  properties:
                    attachments_per_evaluator: { type: integer, minimum: 1, maximum: 50 }
                    quality_good_threshold: { type: number, format: double, minimum: 0, maximum: 1, default: 0.6 }
                    quality_bad_threshold: { type: number, format: double, minimum: 0, maximum: 1, default: 0.3 }
                    adjustment_magnitude: { type: integer, minimum: 1, maximum: 10, default: 3 }
                    min_evaluations_per_file:
                      type: integer
                      minimum: 1
                      maximum: 20
                      description: 'Default min(3, attachments_per_evaluator)'
      responses:
        '200':
          description: Etapa actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      description: { type: string }
                      start_date: { type: string, format: date }
                      end_date: { type: string, format: date }
                      stage: { $ref: '#/components/schemas/Stage' }
                      participation_estimated_end_date: { type: string, format: date, nullable: true }
                      voting_estimated_end_date: { type: string, format: date, nullable: true }
                      author_id: { type: string, format: uuid }
                      updated_at: { type: string, format: date-time }
                  message: { type: string }
                  code: { type: string, example: STAGE_UPDATED }
                  transition:
                    type: object
                    properties:
                      from: { $ref: '#/components/schemas/Stage' }
                      to: { $ref: '#/components/schemas/Stage' }
                  voting:
                    type: object
                    description: 'Solo cuando stage = voting (S-006)'
                    properties:
                      configuration: { $ref: '#/components/schemas/VotingConfiguration' }
                      assignments_count: { type: integer }
                      total_attachments: { type: integer }
        '400':
          description: |
            `MISSING_EVENT_ID`, `INVALID_EVENT_ID`, `INVALID_PAYLOAD`, `INVALID_STAGE`,
            `INVALID_TRANSITION` (+ `current_stage`, `requested_stage`),
            `MISSING_ESTIMATED_DATE`, `INVALID_DATE_FORMAT`, `INVALID_ESTIMATED_DATE`,
            `INSUFFICIENT_ATTACHMENTS` (+ `current_count`, `required_minimum: 3`),
            `MISSING_VOTING_CONFIG`, `INVALID_THRESHOLDS`, `M_EXCEEDS_EVALUABLE`,
            `MATH_CONSTRAINT_VIOLATION`. (`INSUFFICIENT_PARTICIPANTS` y `NO_ATTACHMENTS` dejan
            de usarse en esta transición, S-006.)
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`PARTICIPANTS_ERROR`, `ATTACHMENTS_ERROR`, `DB_UPDATE_ERROR`, `RETRIEVAL_ERROR`, `VOTING_SETUP_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/estimated-end-date:
    patch:
      tags: [Eventos]
      summary: Actualizar fecha estimada de fin de una etapa
      description: 'Solo posponer. Efecto (S-009): email existente + notificación `deadline_changed` a los inscriptos.'
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, estimated_end_date]
              properties:
                stage: { type: string, enum: [participation, voting] }
                estimated_end_date: { type: string, format: date }
      responses:
        '200':
          description: Fecha actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      event_id: { type: string, format: uuid }
                      stage: { type: string }
                      estimated_end_date: { type: string, format: date }
                      previous_date:
                        type: string
                        description: Cadena vacía si no había fecha previa (no null)
                  code: { type: string, example: ESTIMATED_DATE_UPDATED }
        '400':
          description: |
            `INVALID_EVENT_ID`, `INVALID_PAYLOAD`, `INVALID_STAGE`, `INVALID_DATE_FORMAT`,
            `INVALID_ESTIMATED_DATE`.

            `CANNOT_ADVANCE_DEADLINE` — solo se puede posponer el deadline de una etapa que
            todavía no terminó, nunca adelantarlo. `details` es un objeto
            `{current_date, requested_date}`.

            `INVALID_STAGE_FOR_EDIT` — `details` es un **objeto**
            `{current_stage, requested_stage}`, no un string.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`UPDATE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/cancel:
    patch:
      tags: [Eventos]
      summary: Cancelar el evento
      description: 'Sin body. Operación irreversible. Efecto (S-009): email existente + notificación `event_cancelled` a los inscriptos.'
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Evento cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      stage: { $ref: '#/components/schemas/Stage' }
                      is_cancelled: { type: boolean, example: true }
                  message: { type: string }
                  code: { type: string, example: EVENT_CANCELLED }
        '400':
          description: '`INVALID_EVENT_ID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`ALREADY_CANCELLED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`CANCEL_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/pause:
    patch:
      tags: [Eventos]
      summary: Pausar o reanudar el evento
      description: |
        Sin body. Es un **toggle**: invierte el estado actual de `is_paused`.
        No se puede pausar un evento cancelado.

        Nota: `data.name` y `data.stage` se leen del objeto previo al update.

        Efecto (S-009): al pausar (no al reanudar), email existente + notificación
        `event_paused` a los inscriptos.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Estado de pausa invertido
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      stage: { $ref: '#/components/schemas/Stage' }
                      is_paused: { type: boolean }
                  message: { type: string, example: Event paused successfully }
                  code:
                    type: string
                    enum: [EVENT_PAUSED, EVENT_RESUMED]
                    description: '`EVENT_PAUSED` también se usa como código de error 403 en otros endpoints'
        '400':
          description: '`INVALID_EVENT_ID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`EVENT_CANCELLED` — no se puede pausar un evento cancelado'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`UPDATE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/participants:
    get:
      tags: [Participación]
      summary: Listar participantes del evento
      description: |
        Cualquier usuario autenticado. El `role` es el rol **dentro del evento**.
        Un evento en `creation` ajeno responde 404 (S-008).

        ⚠️ Devuelve `email` a cualquier usuario autenticado; la web solo lo muestra al
        organizador. Deuda de privacidad fuera del alcance de REQ-003.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Participantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      event:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          stage: { $ref: '#/components/schemas/Stage' }
                      participants:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            email: { type: string, format: email }
                            role: { type: string, enum: [creator, participant] }
                            created_at: { type: string, format: date-time }
                  count: { type: integer }
        '400':
          description: '`MISSING_EVENT_ID`, `INVALID_EVENT_ID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`RETRIEVAL_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/participant/{participant_id}/attachment:
    post:
      tags: [Propuestas]
      summary: Subir la propuesta de un participante
      description: |
        Solo durante la etapa `participation`, y solo el propio participante o el autor del
        evento. **Una sola propuesta por participante por evento.** El creador del evento no
        puede subir propuestas.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ParticipantId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                description:
                  type: string
                  maxLength: 1000
                  description: Opcional. Se guarda sin espacios al principio ni al final
                file:
                  type: string
                  format: binary
                  description: |
                    Tipos permitidos: image/jpeg, image/png, image/gif, image/webp (S-006), application/pdf,
                    text/plain, application/msword,
                    application/vnd.openxmlformats-officedocument.wordprocessingml.document.
                    Tamaño máximo según MAX_FILE_SIZE (10MB por defecto).
      responses:
        '201':
          description: Propuesta cargada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      filename: { type: string, description: Nombre original del archivo }
                      size: { type: integer, format: int64 }
                      mime_type: { type: string }
                      description: { type: string, description: Vacío si no se envió }
                      participant: { type: string, description: Nombre del participante }
                      uploaded_at: { type: string, format: date-time }
                  message: { type: string }
                  code: { type: string, example: UPLOAD_SUCCESS }
        '400':
          description: |
            `MISSING_PARAMETERS`, `INVALID_EVENT_ID`, `INVALID_PARTICIPANT_ID`,
            `INVALID_EVENT_STAGE` (+ `current_stage`), `NO_FILE`,
            `DESCRIPTION_TOO_LONG`, `FILE_TOO_LARGE` (+ `max_size` string, `received_size` int),
            `INVALID_FILE_TYPE` (+ `received_type`, `allowed_types` con descripciones
            legibles y orden no determinístico), `INVALID_FILENAME`
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403':
          description: '`EVENT_PAUSED`, `CREATOR_CANNOT_UPLOAD`, `NOT_REGISTERED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: '`EVENT_NOT_FOUND`, `PARTICIPANT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`DUPLICATE_ATTACHMENT` (+ `existing_attachment_id`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`FILE_SAVE_ERROR`, `DB_SAVE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/attachments:
    get:
      tags: [Propuestas]
      summary: Listar propuestas del evento
      description: |
        No valida el formato del UUID ni la existencia del evento: un evento inexistente
        devuelve `200` con `data: []`.

        Los nombres de campo difieren de los de la subida: acá `original_name` y `file_size`,
        allá `filename` y `size`.

        **Anonimato (S-007):** el autor del evento y un `admin` reciben todas las propuestas;
        cualquier otro usuario recibe solo las propias. Un evento en `creation` ajeno responde
        404 (S-008).
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Propuestas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        event_id: { type: string, format: uuid }
                        participant_id: { type: string, format: uuid }
                        original_name: { type: string }
                        file_size: { type: integer, format: int64 }
                        mime_type: { type: string }
                        description: { type: string, description: Se omite si está vacía }
                        uploaded_at: { type: string, format: date-time }
                        url: { type: string, example: '/api/v1/attachments/3fa85f64-5717-4562-b3fc-2c963f66afa6/download' }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '500':
          description: '`RETRIEVAL_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/attachments/{attachment_id}/download:
    get:
      tags: [Propuestas]
      summary: Descargar una propuesta
      description: |
        Pueden descargarla su dueño, el autor del evento o un `admin`, y (S-007) quien la tiene
        en su asignación del mismo evento en etapa `voting` o `results` (cierra D-15). El
        permiso se verifica en el handler (`canDownload`), no con un middleware de ruta.

        **Anonimato:** para el evaluador, `Content-Disposition` usa un nombre neutro
        `propuesta-{n}.{ext}` (n = posición en `attachment_ids`), nunca el nombre original.

        Si la copia del stream falla a mitad de camino, la respuesta queda truncada con el
        `200` ya enviado.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: |
            Contenido binario del archivo. Headers: `Content-Disposition: attachment;
            filename="<nombre original>"` (o `propuesta-{n}.{ext}` para el evaluador),
            `Content-Type`, `Content-Length`.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403':
          description: '`FORBIDDEN` — no es el dueño, el autor del evento, un admin ni un evaluador con esa propuesta asignada'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: '`ATTACHMENT_NOT_FOUND`, `FILE_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/attachments/{attachment_id}:
    delete:
      tags: [Propuestas]
      summary: Eliminar la propia propuesta
      description: |
        Solo el dueño de la propuesta, y solo durante la etapa `participation`: permite
        reemplazarla subiendo otra. Ni el autor del evento ni un `admin` pueden eliminar la
        propuesta de otro.

        Se borra primero el registro y después el archivo. Si falla el borrado del archivo,
        la respuesta es igual `200`: el archivo queda huérfano en el storage.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Propuesta eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Attachment deleted successfully }
                  code: { type: string, example: DELETE_SUCCESS }
        '400':
          description: '`INVALID_EVENT_STAGE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403':
          description: '`FORBIDDEN` (no es el dueño), `CREATOR_CANNOT_DELETE`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: '`ATTACHMENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`EVENT_LOOKUP_ERROR`, `DB_DELETE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/voting-config/preview:
    get:
      tags: [Votación distribuida]
      summary: Vista previa del reparto para abrir la votación
      description: |
        S-006. Solo el autor (`RequireEventOwner`). Usa la misma lógica que valida la apertura
        (`VotingService`), así el front no recalcula `m`. El `min_evaluations_per_file`
        recomendado es `min(3, m)`.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Resumen del reparto
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      participants_count: { type: integer, description: Inscriptos }
                      participants_with_proposal: { type: integer, description: 'k' }
                      can_open_voting: { type: boolean, description: 'k >= 3' }
                      min_m: { type: integer }
                      max_m: { type: integer, description: 'k − 1' }
                      recommended_m: { type: integer }
                      defaults:
                        type: object
                        properties:
                          quality_good_threshold: { type: number, example: 0.6 }
                          quality_bad_threshold: { type: number, example: 0.3 }
                          adjustment_magnitude: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/voting-config:
    post:
      tags: [Votación distribuida]
      summary: Configurar los parámetros de votación
      deprecated: true
      description: |
        **Deprecado (S-006):** la configuración se envía en `PATCH /stage` con `voting_config`.
        Usa la misma regla de mínimo (3 propuestas) y de evaluadores.

        Solo el autor del evento, un organizador o un admin. Una sola configuración por evento.
        Requiere al menos 3 propuestas (`INSUFFICIENT_ATTACHMENTS`).

        Valida las restricciones matemáticas del algoritmo: `m ≤ k-1` (nadie evalúa lo propio),
        `m ≥ 2·log₂(k)` para convergencia, y cobertura suficiente (`n·m ≥ k·min_evaluations`).
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachments_per_evaluator]
              properties:
                attachments_per_evaluator:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Parámetro `m`. No puede superar (total de propuestas − 1)
                quality_good_threshold:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 1
                  default: 0.6
                quality_bad_threshold:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 1
                  default: 0.3
                adjustment_magnitude:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 3
                  description: |
                    Parámetro `n` — posiciones que sube o baja el ajuste. Opcional: si se
                    omite se aplica el default. El binding usa `omitempty`, así que el rango
                    solo se valida cuando el campo viene presente.
                min_evaluations_per_file:
                  type: integer
                  minimum: 1
                  maximum: 20
                  description: |
                    Opcional. Si se omite se aplica `min(3, attachments_per_evaluator)`.
      responses:
        '201':
          description: Configuración creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/VotingConfiguration' }
                  message: { type: string }
                  code: { type: string, example: CONFIG_CREATED }
                  statistics:
                    type: object
                    properties:
                      participants_count: { type: integer }
                      attachments_count: { type: integer }
                      max_evaluations: { type: integer }
                      min_evaluations: { type: integer }
        '400':
          description: |
            `MISSING_EVENT_ID`, `INVALID_EVENT_ID`, `INVALID_PAYLOAD`, `INVALID_THRESHOLDS`,
            `INVALID_EVENT_STAGE`, `INSUFFICIENT_ATTACHMENTS` (+ `current_count`,
            `required_minimum: 3`), `M_EXCEEDS_EVALUABLE`, `MATH_CONSTRAINT_VIOLATION`
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`CONFIG_EXISTS` (+ `existing_config`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`PARTICIPANTS_ERROR`, `ATTACHMENTS_ERROR`, `DB_SAVE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/generate-assignments:
    post:
      tags: [Votación distribuida]
      summary: Generar las asignaciones de evaluación
      deprecated: true
      description: |
        **Deprecado (S-006):** las asignaciones se generan dentro de `PATCH /stage`. Usa la
        misma regla: evaluadores = participantes con propuesta, mínimo 3 propuestas.

        Sin body. Solo durante la etapa `voting` y una sola vez por evento. Requiere al menos 3
        propuestas (`INSUFFICIENT_ATTACHMENTS`); `total_participants` es la cantidad de
        evaluadores (participantes con propuesta).

        Ejecuta el algoritmo de asignación: garantiza el mínimo de evaluaciones por propuesta,
        completa hasta `m` por participante y excluye la propuesta propia de cada evaluador.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '201':
          description: Asignaciones generadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assignments_count: { type: integer }
                      total_participants: { type: integer }
                      total_attachments: { type: integer }
                      total_evaluations: { type: integer }
                      attachments_per_evaluator: { type: integer }
                  message: { type: string }
                  code: { type: string, example: ASSIGNMENTS_GENERATED }
                  config:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      attachments_per_evaluator: { type: integer }
                      min_evaluations_per_file: { type: integer }
        '400':
          description: |
            `MISSING_EVENT_ID`, `INVALID_EVENT_ID`, `INVALID_EVENT_STAGE`,
            `INSUFFICIENT_ATTACHMENTS` (+ `current_count`, `required_minimum: 3`), `CONFIG_INVALID`
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`, `CONFIG_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`ASSIGNMENTS_EXIST` (+ `existing_assignments`)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`PARTICIPANTS_ERROR`, `ATTACHMENTS_ERROR`, `GENERATION_FAILED`, `DB_SAVE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/participants/{participant_id}/assignment:
    get:
      tags: [Votación distribuida]
      summary: Obtener la asignación de un participante
      description: |
        Las propuestas que le tocó evaluar. Solo el propio participante, el autor del evento
        o un admin, en etapa `voting` o `results` (S-007).

        Payload construido explícitamente (S-007): **anónimo**, sin autor ni nombre original de
        cada propuesta y sin campos internos (`quality_score`, `expertise_match_score`,
        `conflict_of_interest`). Un inscripto sin asignación recibe `404 NO_ASSIGNMENT`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '200':
          description: Asignación
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment: { $ref: '#/components/schemas/AnonymousAssignment' }
                  event_name: { type: string }
                  participant_id: { type: string, format: uuid, description: El propio evaluador }
        '400':
          description: Parámetros faltantes, o el evento no está en `voting` ni `results` (+ `current_stage`)
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403':
          description: El participante no está registrado en el evento
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '404':
          description: 'Evento inexistente; `NO_ASSIGNMENT` si el participante no tiene asignación (S-007, forma ApiError)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/participants/{participant_id}/ranking-votes:
    post:
      tags: [Votación distribuida]
      summary: Enviar el ranking de evaluación
      description: |
        Envío definitivo. Los rangos tienen que ser enteros **consecutivos desde 1**, sin
        duplicados, y cada propuesta tiene que pertenecer a la asignación del participante.

        **Reenvío (S-007):** si la asignación ya está completa y el evento sigue en `voting`,
        el ranking nuevo reemplaza al anterior (`DELETE` + `INSERT` en una transacción; los
        triggers mantienen `is_completed` y `vote_count`) y la respuesta trae `replaced: true`.
        Fuera de `voting` responde 400.

        Efecto (S-009): notificación `ranking_submitted` al participante.

        Respuesta plana, sin envelope `data` ni `code`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ParticipantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignment_id, rankings]
              properties:
                assignment_id: { type: string, format: uuid }
                rankings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [attachment_id, rank]
                    properties:
                      attachment_id: { type: string, format: uuid }
                      rank: { type: integer, minimum: 1, description: '1 = mejor' }
      responses:
        '201':
          description: Votos registrados
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Ranking votes submitted successfully }
                  event_id: { type: string, format: uuid }
                  participant_id: { type: string, format: uuid }
                  votes_count: { type: integer }
                  replaced: { type: boolean, description: 'true si reemplazó un ranking anterior (S-007)' }
        '400':
          description: |
            Payload inválido, etapa incorrecta, `assignment_id` que no corresponde,
            rangos duplicados o no consecutivos, propuesta no asignada o de otro evento.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403':
          description: El participante no está registrado en el evento
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '404':
          description: Evento, asignación o propuesta inexistente
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '500':
          description: Fallo al guardar los votos
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }

  /api/v1/events/{event_id}/participants/{participant_id}/vote-draft:
    put:
      tags: [Borradores de voto]
      summary: Guardar borrador del ranking
      description: |
        Guardado parcial mientras el participante arma su ranking, para no perder el progreso.
        A diferencia del envío definitivo, **no** valida duplicados ni consecutividad.

        Un borrador por par (asignación, participante): el guardado es un upsert. Se acepta
        también con la asignación completa mientras el evento esté en `voting` (S-007).

        Nota: `updated_at` en la respuesta sale del objeto previo al upsert, así que suele
        venir como fecha cero.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ParticipantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rankings]
              properties:
                rankings:
                  type: array
                  items:
                    type: object
                    properties:
                      attachment_id: { type: string, format: uuid }
                      rank: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Borrador guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      assignment_id: { type: string, format: uuid }
                      participant_id: { type: string, format: uuid }
                      rankings_count: { type: integer }
                      updated_at: { type: string, format: date-time }
                  code: { type: string, example: DRAFT_SAVED }
        '400':
          description: '`INVALID_EVENT_ID`, `INVALID_PARTICIPANT_ID`, `INVALID_PAYLOAD`, `INVALID_ATTACHMENT_ID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: '`ASSIGNMENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`DRAFT_SAVE_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

    get:
      tags: [Borradores de voto]
      summary: Recuperar el borrador guardado
      description: 'Un `404 DRAFT_NOT_FOUND` es la respuesta esperada cuando aún no hay borrador.'
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/ParticipantId'
      responses:
        '200':
          description: Borrador
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      event_id: { type: string, format: uuid }
                      assignment_id: { type: string, format: uuid }
                      participant_id: { type: string, format: uuid }
                      rankings:
                        type: array
                        items:
                          type: object
                          properties:
                            attachment_id: { type: string, format: uuid }
                            rank: { type: integer }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
        '400':
          description: '`INVALID_PARTICIPANT_ID`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: '`ASSIGNMENT_NOT_FOUND`, `DRAFT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '500':
          description: '`DRAFT_GET_ERROR`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/events/{event_id}/distributed-results:
    get:
      tags: [Votación distribuida]
      summary: Resultados de la votación distribuida (solo lectura)
      description: |
        Devuelve el ranking global (`global_ranking`, por puntaje MBC) y el ranking ajustado
        por el sistema de incentivos (`adjusted_ranking`), más la calidad de cada evaluador.

        **Solo lectura:** devuelve la fila guardada en `voting_results` (calculada al entrar a
        la etapa `results`, o por `POST .../distributed-results/recalculate`). No escribe ni
        recalcula.

        Disponible en las etapas `voting` y `results`. **Público (sin sesión)**: el detalle
        del evento y sus resultados son visibles para visitantes anónimos.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: include_metrics
          in: query
          schema: { type: string, enum: ['true'] }
          description: Si es exactamente `true`, agrega `data.configuration`
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      event_id: { type: string, format: uuid }
                      global_ranking:
                        type: array
                        items: { $ref: '#/components/schemas/AttachmentResult' }
                      adjusted_ranking:
                        type: array
                        items: { $ref: '#/components/schemas/AttachmentResult' }
                      participant_qualities:
                        type: object
                        additionalProperties: { type: number, format: double }
                        description: 'UUID del participante → Q_i en [0,1]'
                      total_participants: { type: integer }
                      total_votes: { type: integer }
                      attachments_per_evaluator: { type: integer }
                      calculated_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      configuration: { $ref: '#/components/schemas/VotingConfiguration' }
        '400':
          description: '`event_id` ausente o con formato inválido'
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '403':
          description: Etapa incorrecta (+ `current_stage`). Semánticamente debería ser 400.
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '404':
          description: Evento inexistente, o `RESULTS_NOT_CALCULATED` si todavía no se guardó el ranking
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }

  /api/v1/events/{event_id}/distributed-results/recalculate:
    post:
      tags: [Votación distribuida]
      summary: Recalcular los resultados de la votación
      description: |
        Recalcula el MBC, rellena los nombres de los autores y hace upsert en `voting_results`.

        **⚠️ Muta estado:** no es idempotente (defecto D-11, ahora aislado en este POST).

        Se ejecuta automáticamente cuando el organizador pasa el evento a la etapa `results`,
        y lo llama el frontend como fallback si un evento llegó a `results` sin ranking
        guardado. La respuesta tiene el mismo shape que el GET de solo lectura.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: include_metrics
          in: query
          schema: { type: string, enum: ['true'] }
          description: Si es exactamente `true`, agrega `data.configuration`
      responses:
        '200':
          description: Resultados recalculados (mismo schema que el GET)
          content: { application/json: { schema: { type: object } } }
        '400':
          description: '`event_id` ausente o con formato inválido'
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403':
          description: Etapa incorrecta (+ `current_stage`)
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '404':
          description: Evento o configuración de votación inexistente
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '500':
          description: Fallo al calcular o guardar los resultados
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }

  /api/v1/events/{event_id}/voting-statistics:
    get:
      tags: [Votación distribuida]
      summary: Estadísticas de avance de la votación
      description: |
        Progreso de la votación sin recalcular resultados. No valida el UUID ni la existencia
        del evento.

        Los umbrales de calidad usados acá están **hardcodeados** (≥0.7 bueno, ≤0.3 malo) y no
        coinciden con los configurables por evento.

        **Público (sin sesión)**: los visitantes anónimos ven el avance de la votación.
        Un evento en `creation` ajeno responde 404 (S-008).
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      event_id: { type: string, format: uuid }
                      total_votes: { type: integer }
                      total_assignments: { type: integer }
                      completed_assignments: { type: integer }
                      completion_rate:
                        type: number
                        format: double
                        description: 'Fracción entre 0 y 1, no porcentaje'
                      attachments_with_votes: { type: integer }
                      unique_voters: { type: integer }
                      average_quality_score: { type: number, format: double }
                      participants_with_good_quality: { type: integer }
                      participants_with_bad_quality: { type: integer }
                      participant_voting_status:
                        type: object
                        additionalProperties: { type: boolean }
                        description: 'UUID del participante → si ya votó'
        '400':
          description: '`event_id` ausente'
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }
        '500':
          description: Fallo al obtener votos o asignaciones
          content: { application/json: { schema: { $ref: '#/components/schemas/LegacyError' } } }

  /api/v1/events/{event_id}/reminders:
    post:
      tags: [Eventos]
      summary: Recordatorio manual a pendientes
      description: |
        S-009. Solo el autor (`RequireEventOwner`). `file` solo en `participation`
        (destinatarios = inscriptos sin propuesta); `vote` solo en `voting` (destinatarios =
        asignaciones sin completar). Envía email en segundo plano y una notificación
        `file_reminder` / `vote_reminder` por destinatario.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [file, vote] }
      responses:
        '200':
          description: Recordatorio enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { type: string, enum: [file, vote] }
                      recipients_count: { type: integer }
                  message: { type: string }
                  code: { type: string, example: REMINDER_SENT }
        '400':
          description: '`INVALID_PAYLOAD`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '403': { $ref: '#/components/responses/MiddlewareForbidden' }
        '404':
          description: '`EVENT_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: '`INVALID_EVENT_STAGE` (+ `current_stage`), `NO_PENDING_RECIPIENTS`, `EVENT_PAUSED_OR_CANCELLED`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/notifications:
    get:
      tags: [Notificaciones]
      summary: Listar las notificaciones propias
      description: |
        S-009. Filtra siempre por el usuario del JWT y por los últimos 90 días, de la más
        reciente a la más antigua. Además borra las del usuario con más de 90 días.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: before
          in: query
          schema: { type: string, format: date-time }
          description: Cursor por `created_at` (exclusivo)
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unread_count: { type: integer }
                  next_cursor: { type: string, format: date-time, nullable: true }
        '400':
          description: '`INVALID_PAYLOAD` (`limit` o `before` inválidos)'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }

  /api/v1/notifications/unread-count:
    get:
      tags: [Notificaciones]
      summary: Cantidad de notificaciones sin leer
      description: 'S-009. Es el endpoint del polling de la web (ADR-009).'
      responses:
        '200':
          description: Contador
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }

  /api/v1/notifications/{notification_id}/read:
    patch:
      tags: [Notificaciones]
      summary: Marcar una notificación como leída
      description: 'S-009. Idempotente. Una notificación ajena responde 404, no 403.'
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      read_at: { type: string, format: date-time }
                  code: { type: string, example: NOTIFICATION_READ }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }
        '404':
          description: '`NOTIFICATION_NOT_FOUND`'
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /api/v1/notifications/read-all:
    post:
      tags: [Notificaciones]
      summary: Marcar todas como leídas
      responses:
        '200':
          description: Marcadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated: { type: integer }
                  code: { type: string, example: NOTIFICATIONS_READ }
        '401': { $ref: '#/components/responses/MiddlewareUnauthorized' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT HS256, 24 horas de vigencia. Header: `Authorization: Bearer <token>`'

  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ParticipantId:
      name: participant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    MiddlewareUnauthorized:
      description: |
        Token ausente, mal formado o inválido. Emitido por `JWTAuthMiddleware`, con la
        forma `{error: "UNAUTHORIZED", message: "..."}` — inversa a la de los handlers.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MiddlewareError' }
    MiddlewareForbidden:
      description: |
        Autenticado pero sin permiso sobre el recurso. Emitido por los middlewares de
        permisos, con la forma `{error: "FORBIDDEN", message: "..."}`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MiddlewareError' }

  schemas:

    ApiError:
      type: object
      description: |
        Forma de error de los handlers. `error` es el mensaje legible y `code` el
        identificador estable. Algunas respuestas agregan claves ad-hoc según el caso
        (`current_stage`, `valid_stages`, `max_size`, etc.).
      properties:
        error: { type: string, description: Mensaje legible }
        code: { type: string, description: 'Identificador en SCREAMING_SNAKE' }
        details:
          description: 'String en casi todos los casos; objeto en `INVALID_STAGE_FOR_EDIT`'
          oneOf:
            - type: string
            - type: object
      required: [error]

    MiddlewareError:
      type: object
      description: |
        Forma de error de los middlewares de autenticación y permisos. **`error` contiene el
        código** y `message` el texto: es la inversa de `ApiError`. Nunca trae `code`.
      properties:
        error:
          type: string
          enum: [UNAUTHORIZED, FORBIDDEN, BAD_REQUEST, NOT_FOUND]
        message: { type: string }
      required: [error, message]

    LegacyError:
      type: object
      description: |
        Forma degradada sin `code`, en los endpoints de votación distribuida. Puede sumar
        claves sueltas como `current_stage` o `details`.
      properties:
        error: { type: string }
        details: { type: string }
        current_stage: { $ref: '#/components/schemas/Stage' }
      required: [error]

    Stage:
      type: string
      enum: [creation, participation, voting, results]
      description: |
        Etapa del evento. Las transiciones son estrictamente
        `creation → participation → voting → results`, sin retroceso ni saltos.

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lastname: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, organizer, participant]
          nullable: true
          description: 'Rol global. Distinto del rol por evento (creator/participant)'
        created_at: { type: string, format: date-time }

    EventListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        stage: { $ref: '#/components/schemas/Stage' }
        author_id: { type: string, format: uuid }
        max_participants: { type: integer, nullable: true }
        participation_estimated_end_date: { type: string, format: date, nullable: true }
        voting_estimated_end_date: { type: string, format: date, nullable: true }
        participant_ids:
          type: array
          items: { type: string, format: uuid }
        participants_count: { type: integer, description: 'S-008' }
        is_cancelled: { type: boolean }
        is_paused: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventListItem'
        - type: object
          properties:
            organizer:
              type: string
              description: Si el evento no define organizador, cae al nombre del autor
            attachment_count: { type: integer }

    VotingConfiguration:
      type: object
      description: Parámetros matemáticos del algoritmo de votación para un evento
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        attachments_per_evaluator: { type: integer, description: 'Parámetro m' }
        quality_good_threshold: { type: number, format: double }
        quality_bad_threshold: { type: number, format: double }
        adjustment_magnitude: { type: integer, description: 'Parámetro n' }
        min_evaluations_per_file: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Assignment:
      type: object
      description: Conjunto de propuestas que un participante debe evaluar
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        participant_id: { type: string, format: uuid }
        attachment_ids:
          type: array
          items: { type: string, format: uuid }
        assignment_round: { type: integer, default: 1 }
        is_completed:
          type: boolean
          description: Lo mantiene un trigger de Postgres según la cantidad de votos emitidos
        completed_at: { type: string, format: date-time, nullable: true }
        quality_score:
          type: number
          format: double
          nullable: true
          description: 'Q_i del evaluador, en [0,1]'
        expertise_match_score: { type: number, format: double, nullable: true }
        conflict_of_interest: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AnonymousAssignment:
      type: object
      description: |
        Asignación vista por el evaluador (S-007). No expone autoría de las propuestas ni
        métricas internas.
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        is_completed: { type: boolean }
        completed_at: { type: string, format: date-time, nullable: true }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string, example: Propuesta 1, description: 'Posición en attachment_ids (1-based)' }
              mime_type: { type: string }
              file_size: { type: integer, format: int64 }
              description: { type: string, nullable: true }

    NotificationType:
      type: string
      enum:
        - stage_changed
        - event_cancelled
        - event_paused
        - deadline_changed
        - participant_registered
        - registration_confirmed
        - ranking_submitted
        - file_reminder
        - vote_reminder

    Notification:
      type: object
      description: |
        S-009. Se guarda `type` + `data`, no texto (ADR-009): la web compone el texto en el
        idioma del usuario con el nombre vigente del evento.

        `data` por tipo: `stage_changed` → `{stage, deadline?}` + en `voting`
        `{can_vote, assigned_count?}` + en `results` `{result_position?, result_total?}`;
        `deadline_changed` → `{stage, new_date}`; `participant_registered` → `{count}`;
        `ranking_submitted` → `{replaced}`; `file_reminder` / `vote_reminder` → `{deadline}`;
        el resto → `{}`.
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        data: { type: object, additionalProperties: true }
        event:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            stage: { $ref: '#/components/schemas/Stage' }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AttachmentResult:
      type: object
      description: Resultado de una propuesta en el ranking
      properties:
        attachment_id: { type: string, format: uuid }
        filename: { type: string }
        participant_id: { type: string, format: uuid }
        participant_name: { type: string, description: Puede estar ausente }
        mbc_score:
          type: number
          format: double
          description: 'Puntaje Modified Borda Count normalizado en [0,1]'
        global_rank: { type: integer, description: Posición por puntaje MBC }
        adjusted_rank: { type: integer, description: Posición tras aplicar incentivos por calidad }
        vote_count: { type: integer }
        average_rank: { type: number, format: double }
