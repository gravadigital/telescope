# Producción: baja las imágenes publicadas del registry. La versión de cada una sale de
# API_VERSION / WEB_VERSION en .env — ver la política de versionado en CHANGELOG.md.
#
# Para desarrollo usá docker-compose.local.yml, que construye desde el repo.
name: telescope

networks:
  telescope-database:
    name: "telescope-${ENVIRONMENT}-database"
  ingress-network:
    external: true
    name: "${INGRESS_NETWORK}"

volumes:
  telescope-database:
    name: "telescope-${ENVIRONMENT}-database"
  telescope-minio:
    name: "telescope-${ENVIRONMENT}-minio"

services:
  telescope-database:
    image: postgres:15-alpine
    container_name: telescope-${ENVIRONMENT}-database
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - telescope-database:/var/lib/postgresql/data
    networks:
      - telescope-database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  telescope-api:
    image: gravadigital/telescope-api:${API_VERSION}
    container_name: telescope-${ENVIRONMENT}-api
    restart: always
    environment:
      - VIRTUAL_HOST=api.${DOMAIN}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=api.${DOMAIN}
      - DB_HOST=${DB_HOST}
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_SSLMODE=${DB_SSLMODE}
      - PORT=8080
      - GIN_MODE=${GIN_MODE}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
      - CORS_ALLOW_METHODS=${CORS_ALLOW_METHODS}
      - CORS_ALLOW_HEADERS=${CORS_ALLOW_HEADERS}
      - FRONTEND_URL=https://${DOMAIN}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_REGION=${MINIO_REGION}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SECURE=${SMTP_SECURE}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
    networks:
      - ingress-network
      - telescope-database
    depends_on:
      telescope-database:
        condition: service_healthy
      telescope-minio:
        condition: service_healthy

  # La web NO recibe REACT_APP_* acá: Create React App las congela en el momento del
  # build, no al arrancar. La URL de la api y el client id de Google entran como
  # --build-arg cuando el CI construye la imagen (ver .github/workflows/).
  telescope-web:
    image: gravadigital/telescope-web:${WEB_VERSION}
    container_name: telescope-${ENVIRONMENT}-web
    restart: always
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DOMAIN}
    networks:
      - ingress-network
    depends_on:
      - telescope-api

  telescope-minio:
    # MinIO dejó de publicar imágenes (Docker Hub y quay.io); pgsty mantiene builds del mismo código.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: telescope-${ENVIRONMENT}-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
      - VIRTUAL_HOST=minio.${DOMAIN}
      - VIRTUAL_PORT=9001
      - LETSENCRYPT_HOST=minio.${DOMAIN}
    volumes:
      - telescope-minio:/data
    networks:
      - telescope-database
      - ingress-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Crea el bucket y termina. La api NO lo crea —firma contra un bucket que da por
  # existente—, así que sin esto la primera subida falla con NoSuchBucket.
  telescope-minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: telescope-${ENVIRONMENT}-minio-init
    restart: "no"
    depends_on:
      telescope-minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://telescope-${ENVIRONMENT}-minio:9000 '${MINIO_ACCESS_KEY}' '${MINIO_SECRET_KEY}' &&
      mc mb --ignore-existing local/'${MINIO_BUCKET}'
      "
    networks:
      - telescope-database

  telescope-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: telescope-${ENVIRONMENT}-pgadmin
    restart: always
    environment:
      - VIRTUAL_HOST=pgadmin.${DOMAIN}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=pgadmin.${DOMAIN}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
    networks:
      - ingress-network
      - telescope-database
    profiles:
      - tools
